# .github/workflows/update-feed.yml
name: Update news feed

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python curate.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit updated feed
        run: |
          git config user.name "tftr-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json used_items.json
          git diff --staged --quiet || git commit -m "Update news feed"
          git push
